name: Lint

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

jobs:
  lint:
    name: Lint (${{ matrix.module }})
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        module:
          - .
          - extra/paceotel
          - examples/basic
          - examples/otel

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
          cache-dependency-path: |
            extra/**/go.sum
            examples/**/go.sum

      - name: Create temporary Go workspace
        run: bash .github/scripts/create-go-workspace.sh --with-examples

      - name: Verify workspace resolution
        env:
          GOWORK: ${{ github.workspace }}/go.work
        run: |
          set -euo pipefail

          test "$(go env GOWORK)" = "${GITHUB_WORKSPACE}/go.work"

          go list -m \
            -f '{{if .Main}}{{.Path}} => {{.Dir}}{{end}}' \
            all |
            sed '/^$/d'

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        env:
          GOWORK: ${{ github.workspace }}/go.work
        with:
          version: v2.12.2
          working-directory: ${{ matrix.module }}
          args: >-
            --config=${{ github.workspace }}/.golangci.yml
            --timeout=5m
            --modules-download-mode=readonly

  result:
    name: Lint
    if: always()
    needs:
      - lint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check lint jobs
        run: test "${{ needs.lint.result }}" = "success"
